name: Documentation Pages
'on':
  workflow_dispatch:
    inputs:
      publish:
        description: Deploy the validated documentation (public main only)
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: documentation-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Check workflow policy
        run: python scripts/check-workflows.py
      - name: Build clean publication
        run: python scripts/build_docs.py docs
      - name: Validate requirement graph
        run: python scripts/release.py validate-docs
      - name: Validate published diagram links
        run: python tools/method/tooling/normalize-diagram-links.py --diagram-dir docs/architecture/diagrams --published-dir docs/_build/html
      - name: Upload validated website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html
          retention-days: 7
  deploy:
    needs: build
    if: inputs.publish && github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
