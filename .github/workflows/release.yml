name: Publish release
'on':
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: release-publication
  cancel-in-progress: false
jobs:
  build:
    if: github.event.repository.visibility == 'public' && !github.event.release.prerelease && !github.event.release.draft
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install maintained toolchain
        run: python -m pip install -r docs/architecture/implementation/requirements-implementation.txt -r requirements-docs.txt
      - name: Verify qualified release assets against the tag
        run: python scripts/release.py prepare
      - name: Validate exact packages and clean documentation
        env:
          STV_RELEASE_DIR: docs/_build/release-publish/packages
        run: python scripts/ci.py validate
      - name: Retain exact publication inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-distributions
          path: docs/_build/release-publish/
          if-no-files-found: error
          retention-days: 14
      - name: Upload validated release documentation
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/_build/html
          retention-days: 7
  publish-pypi:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/sphinx-traceability-view
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-distributions
          path: release
      - name: Verify exact distribution checksums
        working-directory: release
        run: sha256sum --strict --check SHA256SUMS
      - name: Publish qualified distributions through Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release/packages/
          attestations: true
  deploy-docs:
    needs: [build, publish-pypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated release documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
