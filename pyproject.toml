[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sphinx-traceability-view"
version = "0.2.0"
description = "Offline interactive views of a Sphinx-Needs traceability graph"
requires-python = ">=3.10"
dependencies = ["Sphinx==8.1.3", "sphinx-needs==8.2.0", "beautifulsoup4==4.13.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/sphinx_traceability_view"]

[tool.hatch.build.targets.sdist]
exclude = ["/docs/test-execution"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["docs/test-scripts"]
pythonpath = ["src"]
markers = ["requirements(*ids): requirement criteria exercised by this case", "browser: real Firefox integration"]
