[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sphinx-traceability-view"
dynamic = ["version"]
description = "Offline interactive views of a Sphinx-Needs traceability graph"
requires-python = ">=3.10"
authors = [{name = "Henning Heikes"}]
# STV-owned code is MIT; the archive also contains separately licensed browser libraries.
license = "MIT AND ISC AND BSD-3-Clause AND Apache-2.0 AND EPL-1.0 AND EPL-2.0"
license-files = [
    "LICENSE",
    "src/sphinx_traceability_view/static/THIRD_PARTY_NOTICES.txt",
    "src/sphinx_traceability_view/static/vendor/ELK-SOURCE.txt",
]
dependencies = ["Sphinx==8.1.3", "sphinx-needs==8.2.0", "beautifulsoup4==4.13.5"]

[tool.hatch.version]
path = "src/sphinx_traceability_view/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sphinx_traceability_view"]
exclude = ["**/tests/**", "**/README.rst"]

[tool.hatch.build.targets.sdist]
exclude = ["/docs/test-execution"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["src/sphinx_traceability_view", "docs/test-scripts"]
pythonpath = ["src"]
markers = ["requirements(*ids): requirement criteria exercised by this case", "browser: real Firefox integration"]
